name: iOS Upload (TestFlight)

on:
  workflow_dispatch:
    inputs:
      scheme:
        description: Xcode scheme name
        required: true
        default: Run JS
      project:
        description: Xcode project path (.xcodeproj)
        required: true
        default: NotesApp.xcodeproj
      bundle_id:
        description: App bundle identifier
        required: true
        default: com.python.funda

jobs:
  build-and-upload:
    runs-on: macos-latest
    env:
      SCHEME: ${{ github.event.inputs.scheme }}
      PROJECT_PATH: ${{ github.event.inputs.project }}
      BUNDLE_ID: ${{ github.event.inputs.bundle_id }}
      KEYCHAIN: build.keychain
      KEYCHAIN_PASSWORD: ${{ secrets.IOS_KEYCHAIN_PASSWORD }}
      P12_BASE64: ${{ secrets.IOS_P12_BASE64 }}
      P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
      PROFILE_BASE64: ${{ secrets.IOS_PROFILE_BASE64 }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      ASC_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set default keychain password if missing
        if: env.KEYCHAIN_PASSWORD == ''
        run: echo "KEYCHAIN_PASSWORD=$(uuidgen)" >> $GITHUB_ENV

      - name: Create temporary keychain
        run: |
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security default-keychain -s "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"

      - name: Install Signing Certificate (.p12)
        shell: bash
        run: |
          if [ -z "$P12_BASE64" ]; then
            echo "::error::Missing IOS_P12_BASE64 secret"; exit 1; fi
          echo "$P12_BASE64" | base64 --decode > cert.p12
          security import cert.p12 -k "$KEYCHAIN" -P "$P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"

      - name: Install Provisioning Profile
        shell: bash
        run: |
          if [ -z "$PROFILE_BASE64" ]; then
            echo "::error::Missing IOS_PROFILE_BASE64 secret"; exit 1; fi
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          echo "$PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/profile.mobileprovision"
          PROFILE_PLIST="$RUNNER_TEMP/profile.plist"
          security cms -D -i "$RUNNER_TEMP/profile.mobileprovision" > "$PROFILE_PLIST"
          PROFILE_NAME=$( /usr/libexec/PlistBuddy -c 'Print :Name' "$PROFILE_PLIST" )
          PROFILE_UUID=$( /usr/libexec/PlistBuddy -c 'Print :UUID' "$PROFILE_PLIST" )
          cp "$RUNNER_TEMP/profile.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
          echo "PROFILE_NAME=$PROFILE_NAME" >> $GITHUB_ENV
          echo "PROFILE_UUID=$PROFILE_UUID" >> $GITHUB_ENV

      - name: Install fastlane
        run: sudo gem install fastlane -N

      - name: Build archive
        shell: bash
        run: |
          xcodebuild -project "$PROJECT_PATH" \
            -scheme "$SCHEME" \
            -configuration Release \
            -archivePath "$PWD/build/App.xcarchive" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            clean archive -destination 'generic/platform=iOS' -allowProvisioningUpdates | xcpretty || exit 1

      - name: Create export options
        shell: bash
        run: |
          cat > exportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>stripSwiftSymbols</key>
            <true/>
            <key>uploadSymbols</key>
            <true/>
            <key>compileBitcode</key>
            <false/>
            <key>provisioningProfiles</key>
            <dict>
              <key>${BUNDLE_ID}</key>
              <string>${PROFILE_NAME}</string>
            </dict>
          </dict>
          </plist>
          PLIST

      - name: Export IPA
        shell: bash
        run: |
          xcodebuild -exportArchive \
            -archivePath "$PWD/build/App.xcarchive" \
            -exportPath "$PWD/build" \
            -exportOptionsPlist exportOptions.plist | xcpretty || exit 1

      - name: Prepare App Store Connect API key
        shell: bash
        run: |
          if [ -z "$ASC_KEY_BASE64" ] || [ -z "$ASC_KEY_ID" ] || [ -z "$ASC_ISSUER_ID" ]; then
            echo "::error::Missing App Store Connect API key secrets"; exit 1; fi
          echo "$ASC_KEY_BASE64" | base64 --decode > api_key.p8
          cat > api_key.json <<JSON
          {
            "key_id": "$ASC_KEY_ID",
            "issuer_id": "$ASC_ISSUER_ID",
            "key": "$(awk '{printf "%s\\n", $0}' api_key.p8)"
          }
          JSON

      - name: Upload to TestFlight
        shell: bash
        run: |
          IPA_PATH=$(ls build/*.ipa | head -n 1)
          if [ ! -f "$IPA_PATH" ]; then echo "::error::IPA not found"; exit 1; fi
          fastlane pilot upload --ipa "$IPA_PATH" --api_key_path api_key.json --skip_waiting_for_build_processing true

