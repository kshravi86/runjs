name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v4

    - name: Build
      run: |
        xcodebuild clean build \
          -project NotesApp.xcodeproj \
          -scheme "Run JS" \
          -destination "platform=iOS Simulator,name=iPhone 15" \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO
